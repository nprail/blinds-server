<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blinds Controller</title>

  <!--
    Tailwind CSS via CDN (optional — the inline <style> below provides a
    complete fallback so the page renders correctly when the CDN is unreachable).
  -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inline base styles / Tailwind fallback -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #030712; color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* Layout helpers */
    .app-wrap  { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; }
    .flex      { display: flex; }
    .flex-col  { flex-direction: column; }
    .grid-2    { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .grid-4    { display: grid; grid-template-columns: repeat(4,1fr); gap: .5rem; }
    .grid-3    { display: grid; grid-template-columns: repeat(3,1fr); gap: .5rem; }
    .gap-2     { gap: .5rem; }
    .gap-3     { gap: .75rem; }
    .gap-4     { gap: 1rem; }
    .gap-8     { gap: 2rem; }
    .items-center   { align-items: center; }
    .justify-between{ justify-content: space-between; }
    .text-center { text-align: center; }
    .mt-1 { margin-top:.25rem; } .mt-3 { margin-top:.75rem; } .mt-4 { margin-top:1rem; }
    .mb-8 { margin-bottom:2rem; }
    .py-8 { padding-top:2rem;padding-bottom:2rem; }
    .py-16{ padding-top:4rem;padding-bottom:4rem; }

    /* Typography */
    .text-xs   { font-size:.75rem;  line-height:1rem;  }
    .text-sm   { font-size:.875rem; line-height:1.25rem; }
    .text-lg   { font-size:1.125rem;line-height:1.75rem; }
    .text-2xl  { font-size:1.5rem;  line-height:2rem; }
    .font-medium{ font-weight:500; }
    .font-semibold{ font-weight:600; }
    .font-bold { font-weight:700; }
    .tracking-tight { letter-spacing:-.025em; }
    .tracking-wider { letter-spacing:.05em; }
    .uppercase { text-transform: uppercase; }
    .capitalize{ text-transform: capitalize; }
    .animate-pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* Colours */
    .text-gray-400 { color:#9ca3af; }
    .text-gray-500 { color:#6b7280; }
    .text-gray-600 { color:#4b5563; }
    .text-gray-100 { color:#f3f4f6; }
    .text-white    { color:#fff;    }
    .text-red-300  { color:#fca5a5; }
    .text-red-400  { color:#f87171; }
    .text-amber-400{ color:#fbbf24; }
    .text-emerald-400{ color:#34d399; }
    .text-indigo-300 { color:#a5b4fc; }
    .text-violet-400 { color:#a78bfa; }

    /* Cards & surfaces */
    .card {
      border-radius: 1rem;
      border: 1px solid #1f2937;
      background: #111827;
      padding: 1.25rem;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .card-header { display:flex; align-items:center; justify-content:space-between; }
    .state-badge { font-size:.875rem; font-weight:500; }

    /* Buttons */
    button {
      display: flex; align-items: center; justify-content: center; gap: .25rem;
      border-radius: .5rem; padding: .5rem .75rem;
      font-size: .875rem; font-weight: 500; color: #fff;
      border: none; cursor: pointer; transition: background .15s, opacity .15s;
      white-space: nowrap;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-up     { background:#059669; } .btn-up:not(:disabled):hover     { background:#10b981; }
    .btn-down   { background:#dc2626; } .btn-down:not(:disabled):hover   { background:#ef4444; }
    .btn-stop   { background:#d97706; } .btn-stop:not(:disabled):hover   { background:#f59e0b; }
    .btn-pair   { background:#7c3aed; } .btn-pair:not(:disabled):hover   { background:#8b5cf6; }
    .btn-indigo { background:#4f46e5; } .btn-indigo:not(:disabled):hover { background:#6366f1; }
    .btn-outline{
      background:transparent; border:1px solid #374151; color:#9ca3af;
    }
    .btn-outline:not(:disabled):hover { border-color:#6b7280; color:#f3f4f6; }

    /* Form controls */
    select, input[type=number] {
      background: #1f2937; border: 1px solid #374151; color: #f3f4f6;
      border-radius: .5rem; padding: .375rem .5rem; font-size: .875rem;
      width: 100%;
    }
    label { font-size: .75rem; color: #9ca3af; display:block; margin-bottom:.25rem; }

    /* Learn section */
    details > summary {
      cursor: pointer; user-select: none;
      font-size: .75rem; color: #9ca3af; list-style: none;
    }
    details > summary:hover { color: #f3f4f6; }
    details > summary::before { content: '▸ '; }
    details[open] > summary::before { content: '▾ '; }

    /* Alerts */
    .alert-error {
      border-radius: .75rem;
      background: rgba(127,29,29,.4);
      border: 1px solid #b91c1c;
      padding: 1rem; font-size:.875rem; color:#fca5a5; margin-bottom:1.5rem;
    }

    /* Toasts */
    .toast-container {
      position:fixed; bottom:1rem; right:1rem;
      display:flex; flex-direction:column; gap:.5rem; z-index:50;
    }
    .toast {
      display:flex; align-items:center; gap:.5rem;
      padding:.5rem 1rem; border-radius:.5rem;
      font-size:.875rem; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.4);
    }
    .toast-ok    { background:#065f46; color:#d1fae5; }
    .toast-error { background:#7f1d1d; color:#fecaca; }

    /* Separator */
    .section-label {
      font-size:.75rem; font-weight:600; color:#6b7280;
      text-transform:uppercase; letter-spacing:.05em;
      margin-bottom:.75rem;
    }
  </style>

  <!--
    React 18 UMD builds.
    Primary source: local vendor copy (works offline / on Pi without internet).
    If you prefer pure CDN, replace with:
      https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js
  -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root">
    <div style="text-align:center;padding:4rem 1rem;color:#6b7280">
      Loading Blinds Controller…
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
